# ---------------------------------------------------------------- #
# CodeRabbit 기본 설정 (언어 및 페르소나)
# ---------------------------------------------------------------- #
language: "ko-KR"

# 페르소나와 응답 톤앤매너 지시 (최대 250자)
tone_instructions: >
  프론트엔드 코치입니다. 코드 품질을 높이도록 돕는 것이 목표.
  1) 피드백은 명확하고 구체적이며 원인과 개선안을 함께 제시
  2) 가독성, 안정성(예외 처리), 테스트, 유지보수, 확장성 관점 중심으로 제시
  3) 접근성, 브라우저 호환성도 반드시 점검
  4) 공식 문서를 기반으로 제시
  5) clean architecture인지 점검하고 개선안을 함께 제시

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  profile: "chill" # 리뷰 톤
  request_changes_workflow: false # 모든 코멘트 resolve 시 자동 Approve
  high_level_summary: true # PR 전체 요약
  changed_files_summary: false # 파일 단위 요약
  sequence_diagrams: false # 시퀀스 다이어그램
  poem: false # 리뷰 요약에 시 포함
  assess_linked_issues: true # 연결된 이슈 분석
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  path_instructions:
    # ------------------------------
    # 0) 모노레포 공통 규칙 (전역)
    # ------------------------------
    - path: '**'
      instructions: |
        [Monorepo 공통 원칙]
        1) 앱(apps/*)은 패키지(packages/*)를 소비한다. 앱 → 패키지 의존은 허용, 패키지 → 앱 의존은 금지.
        2) packages 내부는 "도메인/레이어 경계"를 지키고, 앱별 요구사항(특정 라우트/환경 변수/배포 설정)에 종속되지 않게 유지.
        3) workspace 경계를 넘는 import는 반드시 목적(재사용/표준화)을 설명하고, 사이드이펙트/전역 상태 공유를 최소화.
        4) 변경 시 “파급 범위”를 점검: 다른 앱(apps/admin 등)과 다른 패키지에 영향이 있는지 체크(타입/빌드/스토리북/테스트).
        5) 에러/예외 처리 기준: 사용자-facing 에러 메시지, 로깅, 재시도 전략, timeout, abort 등을 일관되게.
        6) 접근성: aria-label, role, 키보드 내비게이션, 포커스 트랩, 대비/색상 의존 금지.
        7) 브라우저/디바이스: iOS 사파리, 안드로이드 크롬, viewport/safe-area, 입력폼 자동완성/키보드 이슈 점검.
        8) 변경이 “규칙/패턴”이라면 docs로 남긴다(컨벤션/ADR/가이드). 단발성 예외는 금지.
        9) “확장 가능한 구조”인지 검토: 새 앱 추가/패키지 분리/다국어/테마/권한 확장 시 변경량이 폭발하지 않는지.
        10) 리뷰는 문제점-원인-대안-장단점 순으로 제시하고, 필요한 경우 예시 코드 포함.

    # ------------------------------
    # 1) 앱: apps/web
    # ------------------------------
    - path: 'apps/web/**'
      instructions: |
        [apps/web]
        1) FSD 레이어 배치를 점검하고, 잘못된 위치일 경우 원인과 권장 위치를 함께 제시
          - shared: 전역 공용 모듈 (비즈니스 무관)
          - entities: 도메인 엔터티 (상태/타입/모델/UI - 비즈니스 객체 단위)
          - features: 사용자 기능 단위 (액션/인터랙션 - 비즈니스 시나리오 단위)
          - widgets: 기능 조합 UI 블록 (features + entities 조립)
          - app-pages: "페이지 단위 화면 조립"
        2) 앱 레벨(라우팅/미들웨어/환경변수/권한/에러바운더리)은 packages로 밀어 넣지 말고 앱에 둔다.
        3) 데이터 패칭/캐싱 전략(Next.js RSC, fetch cache, revalidate, client fetch)을 일관되게 유지.
        4) 페이지/라우트는 “조립”만: 복잡한 로직은 features/entities로 내려보낸다.

    # ------------------------------
    # 2) 앱: apps/admin
    # ------------------------------
    - path: 'apps/admin/**'
      instructions: |
        [apps/admin]
        1) apps/web와 공통 로직은 packages로 승격한다(복붙 금지).
        2) 어드민 권한/감사 로그/파괴적 액션(삭제 등)은 안전장치(확인 모달, 롤백/재시도, 권한 체크)를 필수로.
        3) 테이블/필터/페이지네이션은 성능(대량 데이터)과 접근성(키보드/스크린리더) 모두 점검.

    # ------------------------------
    # 3) packages
    # ------------------------------
    - path: 'packages/**'
      instructions: |
        [packages/* 공통]
        1) 패키지는 특정 앱의 라우팅/환경에 종속되지 않도록 설계.
        2) public API(엔트리 포인트)만 노출하고 내부 경로 deep import는 지양. 필요 시 export map 정리 제안.
        3) 타입 안정성: any/unknown 방치 금지.
        4) 의존성 방향 역전이 생기지 않게 점검.

    # ------------------------------
    # 4) UI 패키지: packages/ui
    # ------------------------------
    - path: 'packages/ui/**'
      instructions: |
        [packages/ui]
        1) "비즈니스 무관" 컴포넌트만 허용.
        2) 접근성(ARIA, focus, keyboard) + SSR/RSC 호환성 + 스타일 토큰 일관성을 최우선.
        3) 공용 컴포넌트 API는 변경에 보수적으로: breaking change면 마이그레이션 가이드/코드모드/변경 이유를 문서화.

  auto_review:
    enabled: true # PR 생성 시 자동 리뷰
    auto_incremental_review: true # 새 커밋 시 변경 부분만 리뷰

# ---------------------------------------------------------------- #
# 채팅 기능 세부 설정
# ---------------------------------------------------------------- #
chat:
  auto_reply: false # @coderabbitai 태그 없이도 자동 답글

# ---------------------------------------------------------------- #
# Knowledge Base 세부 설정
# ---------------------------------------------------------------- #
knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: false
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
