<svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spin {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -471.24; }
    }
    .spinner {
      animation: spin 2s cubic-bezier(0.167, 0.167, 0.833, 0.833) infinite;
    }
  </style>

  <circle
    class="spinner"
    cx="125"
    cy="125"
    r="75"
    fill="none"
    stroke="#D2DAE5"
    stroke-width="20"
    stroke-linecap="round"
    stroke-dasharray="400.55 70.69"
  />
</svg>